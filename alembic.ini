# Alembic CLI config. The database URL and schema come from .env (KB_DATABASE_URL, KB_DB_SCHEMA),
# not from this file. Usual commands: `kb migrate`, `alembic current`, `alembic revision -m "..."`.
[alembic]
script_location = %(here)s/kb/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

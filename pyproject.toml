[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgebase-askgov"
version = "0.1.0"
description = "Retrieval pipeline: multi-format ingestion, recursive chunking, LiteLLM/OpenAI embeddings, pgvector search with metadata filters, Cohere rerank, cited results."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "SQLAlchemy>=2.0",
    "numpy>=1.26",
    "litellm>=1.40",
    "cohere>=5.5",
    "tiktoken>=0.7",
    "pypdf>=4.2",
    "fonttools>=4.50",
    "pypdfium2>=4.30",
    "Pillow>=10",
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
eval = ["deepeval>=4.2"]
tesseract = ["pytesseract>=0.3.10"]
mcp = ["mcp>=1.9,<2"]

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
"kb.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
